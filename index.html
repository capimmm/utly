<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projetos · capimmm</title>
<style>
  :root {
    --bg: #000;
    --block: #0a0a0a;
    --block-border: #1a1a1a;
    --glow: #ffffff;
    --glow-soft: #888888;
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.60);
    --ink-faint: rgba(255,255,255,0.34);
    --glass-bg: rgba(255,255,255,0.055);
    --glass-bg-hover: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.14);
    --ease: cubic-bezier(.19, 1, .22, 1);
    --ease-soft: cubic-bezier(.32, .72, 0, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    min-height: 100%;
    background: var(--bg);
    scroll-behavior: smooth;
  }

  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text',
                 'Inter', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* ============================================
     FUNDO DO PROJETO (muda quando seleciona)
     ============================================ */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    background: #000;
    transition: opacity 1.1s var(--ease);
    will-change: opacity;
  }

  .bg-layer.active { opacity: 1; }

  /* ajuste principal: menos blur, mais brilho controlado */
  .bg-frame-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: blur(3px) saturate(115%) brightness(0.42) contrast(1.05);
    transform: scale(1.03);
    will-change: filter;
    transform-origin: center center;
  }

  .bg-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.05s ease;
    will-change: opacity;
    background: transparent;
  }

  .bg-frame.visible { opacity: 1; }

  /* máscara escura centralizada: cards legíveis, site visível nas bordas */
  .bg-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(85% 70% at 50% 50%,
        rgba(0,0,0,0.62) 0%,
        rgba(0,0,0,0.50) 38%,
        rgba(0,0,0,0.78) 68%,
        rgba(0,0,0,0.96) 100%),
      linear-gradient(180deg,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.15) 25%,
        rgba(0,0,0,0.25) 60%,
        rgba(0,0,0,0.75) 100%);
  }

  /* ============================================
     GRADE REATIVA DE FUNDO
     ============================================ */
  #grid {
    position: fixed;
    inset: 0;
    display: grid;
    z-index: 1;
    pointer-events: none;
    transition: opacity 1.1s var(--ease);
    will-change: opacity;
  }

  body.backgrounding #grid { opacity: 0.18; }

  .block {
    background: var(--block);
    border: 1px solid var(--block-border);
    transition: background 0.15s ease,
                box-shadow 0.15s ease,
                border-color 0.15s ease;
    will-change: background, box-shadow;
  }

  /* ============================================
     HOTBAR FLUTUANTE
     ============================================ */
  .hotbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 60;
    display: flex;
    justify-content: center;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    transform: translateY(-130%);
    opacity: 0;
    pointer-events: none;
    transition: transform .65s var(--ease), opacity .4s ease;
    will-change: transform, opacity;
  }

  .hotbar.visible {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .hotbar-inner {
    width: 100%;
    max-width: 980px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 12px;
    border-radius: 18px;
    background: rgba(12,12,12,0.55);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(28px) saturate(170%);
    -webkit-backdrop-filter: blur(28px) saturate(170%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.09) inset,
      0 22px 50px -24px rgba(0,0,0,0.95);
  }

  .hotbar-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    padding-left: 4px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
    transition: opacity .3s ease;
  }
  .hotbar-brand:hover { opacity: .75; }

  .hotbar-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 12px rgba(255,255,255,0.7);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1;   transform: scale(1); }
    50%      { opacity: .45; transform: scale(.85); }
  }

  .hotbar-brand span {
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .hotbar-search {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    transition: background .35s ease, border-color .35s ease;
  }

  .hotbar-search:focus-within {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.22);
  }

  .hotbar-search svg {
    width: 14px; height: 14px;
    flex-shrink: 0;
    stroke: rgba(255,255,255,0.45);
  }

  .hotbar-search input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 13.5px;
    font-family: inherit;
    letter-spacing: -0.01em;
  }

  .hotbar-search input::placeholder { color: rgba(255,255,255,0.35); }

  .hotbar-count {
    flex-shrink: 0;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    padding: 0 10px;
    height: 30px;
    display: flex;
    align-items: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    white-space: nowrap;
  }

  /* ============================================
     CONTEÚDO
     ============================================ */
  main {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 110px 22px 100px;
    pointer-events: none;
  }

  /* ============================================
     HEADER
     ============================================ */
  header {
    text-align: center;
    margin-bottom: 54px;
    animation: fadeIn 1.2s var(--ease) both;
    transition: opacity 1s var(--ease);
  }

  body.backgrounding header { opacity: 0.55; }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 12px;
    border-radius: 100px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.09);
    margin-bottom: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 0 30px rgba(255,255,255,0.03);
  }

  .badge-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px rgba(255,255,255,0.85);
    animation: pulse 3s ease-in-out infinite;
    flex-shrink: 0;
  }

  .badge-text {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: rgba(255,255,255,0.62);
    text-transform: uppercase;
    white-space: nowrap;
  }

  header h1 {
    font-size: clamp(3rem, 8.5vw, 5.6rem);
    font-weight: 800;
    letter-spacing: -0.058em;
    line-height: 0.94;
    background: linear-gradient(180deg,
      #ffffff 0%,
      #ffffff 52%,
      rgba(255,255,255,0.38) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 34px rgba(255,255,255,0.10));
    padding: 0 6px;
  }

  .header-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    max-width: 340px;
    margin: 22px auto 0;
    padding: 0 8px;
  }

  .meta-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg,
      transparent,
      rgba(255,255,255,0.24),
      transparent);
  }

  .meta-text {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  #content {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  /* ============================================
     GRADE DE CARDS
     ============================================ */
  .grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 980px;
    pointer-events: auto;
    align-items: start;
  }

  /* ============================================
     CARD
     ============================================ */
  .card-link {
    display: block;
    text-decoration: none;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
    animation: cardIn .9s var(--ease) both;
  }

  .card-link.oculto { display: none !important; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(26px) scale(0.97); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    filter: blur(0); }
  }

  .card-link:nth-child(1)    { animation-delay: .04s; }
  .card-link:nth-child(2)    { animation-delay: .09s; }
  .card-link:nth-child(3)    { animation-delay: .14s; }
  .card-link:nth-child(4)    { animation-delay: .19s; }
  .card-link:nth-child(5)    { animation-delay: .24s; }
  .card-link:nth-child(6)    { animation-delay: .29s; }
  .card-link:nth-child(7)    { animation-delay: .34s; }
  .card-link:nth-child(8)    { animation-delay: .39s; }
  .card-link:nth-child(9)    { animation-delay: .44s; }
  .card-link:nth-child(10)   { animation-delay: .49s; }
  .card-link:nth-child(n+11) { animation-delay: .54s; }

  .card {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: rgba(10,10,10,0.55);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(26px) saturate(140%);
    -webkit-backdrop-filter: blur(26px) saturate(140%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.16) inset,
      0 22px 45px -28px rgba(0,0,0,0.95);
    transition:
      transform .7s var(--ease-soft),
      opacity .55s ease,
      background .55s ease,
      border-color .55s ease,
      filter .55s ease,
      box-shadow .7s var(--ease-soft);
    will-change: transform, opacity, filter;
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(130% 110% at 0% 0%,
                rgba(255,255,255,0.12), transparent 58%);
    opacity: 0;
    transition: opacity .6s ease;
    pointer-events: none;
    z-index: 2;
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    width: 2px; height: 0;
    transform: translateY(-50%);
    background: linear-gradient(180deg, transparent, #fff, transparent);
    opacity: 0;
    transition: height .7s var(--ease-soft), opacity .6s ease;
    pointer-events: none;
    z-index: 3;
  }

  .card-link:hover .card,
  .card-link.selected .card {
    transform: translateY(-3px);
    background: rgba(18,18,18,0.72);
    border-color: rgba(255,255,255,0.30);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.22) inset,
      0 32px 62px -26px rgba(0,0,0,0.95),
      0 0 46px -14px rgba(255,255,255,0.20);
  }

  .card-link:hover .card::after,
  .card-link.selected .card::after  { opacity: 1; }
  .card-link:hover .card::before,
  .card-link.selected .card::before { height: 58%; opacity: .75; }

  .card-link:active .card {
    transform: translateY(-1px) scale(0.988);
  }

  .card-link:focus-visible .card {
    outline: 2px solid rgba(255,255,255,0.85);
    outline-offset: 3px;
  }

  /* recuo dos outros cards */
  .grid-cards:has(.card-link.selected) .card-link:not(.selected) .card {
    opacity: 0.32;
    transform: scale(0.972);
    filter: saturate(0.35) brightness(0.7);
  }

  .main-row {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 17px 18px;
    position: relative;
    z-index: 4;
  }

  .icon {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .7s var(--ease-soft),
                background .55s ease,
                border-color .55s ease;
  }

  .card-link:hover .icon,
  .card-link.selected .icon {
    transform: scale(1.06);
    background: rgba(255,255,255,0.16);
    border-color: rgba(255,255,255,0.28);
  }

  .icon svg { width: 21px; height: 21px; }

  .info { flex: 1; min-width: 0; }

  .info-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.012em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .info-sub {
    position: relative;
    height: 17px;
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--ink-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .info-sub span {
    position: absolute;
    left: 0; top: 0;
    white-space: nowrap;
    opacity: 1;
    transform: translateY(0);
    transition: opacity .38s var(--ease), transform .45s var(--ease);
  }

  .info-sub span.leaving  { opacity: 0; transform: translateY(-6px); }
  .info-sub span.entering { opacity: 0; transform: translateY(6px); }

  .chevron {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.09);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .7s var(--ease-soft),
                background .55s ease;
  }

  .chevron svg {
    width: 13px; height: 13px;
    transition: transform .7s var(--ease-soft);
  }

  .card-link:hover .chevron,
  .card-link.selected .chevron { background: rgba(255,255,255,0.19); }
  .card-link:hover .chevron svg,
  .card-link.selected .chevron svg { transform: translateX(3px); }

  /* ============================================
     ESTADOS
     ============================================ */
  .loading, .error, .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-dim);
    font-size: .95rem;
    animation: fadeIn .6s ease both;
    width: 100%;
  }

  .empty {
    grid-column: 1 / -1;
    padding: 70px 20px;
    color: var(--ink-faint);
  }

  .spinner {
    width: 30px; height: 30px;
    border: 2px solid rgba(255,255,255,0.12);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .9s linear infinite;
    margin: 0 auto 18px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============================================
     RESPONSIVO
     ============================================ */
  @media (max-width: 640px) {
    main { padding: 90px 16px 70px; }
    header { margin-bottom: 38px; }
    .header-badge { margin-bottom: 18px; padding: 5px 12px 5px 10px; }
    .badge-text { font-size: 9.5px; letter-spacing: 0.20em; }
    .header-meta { max-width: 260px; gap: 10px; }
    .meta-text { font-size: 11px; }
    .grid-cards { grid-template-columns: 1fr; gap: 12px; }
    .hotbar { padding-left: 12px; padding-right: 12px; }
    .hotbar-brand span { display: none; }
    .hotbar-count { display: none; }
  }

  @media (hover: none) {
    .bg-layer { display: none !important; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .block, .card, .icon, .chevron, .chevron svg,
    .card-link, .hotbar, .hotbar-dot,
    .bg-layer, .bg-frame, #grid, header { transition: none; animation: none; }
  }
</style>
</head>
<body>

<!-- ============ FUNDO DO PROJETO ============ -->
<div class="bg-layer" id="bgLayer" aria-hidden="true">
  <div class="bg-frame-wrap">
    <iframe class="bg-frame" id="bgFrameA"
            title="" loading="lazy" referrerpolicy="no-referrer"></iframe>
    <iframe class="bg-frame" id="bgFrameB"
            title="" loading="lazy" referrerpolicy="no-referrer"></iframe>
  </div>
  <div class="bg-vignette"></div>
</div>

<!-- ============ GRADE DE FUNDO ============ -->
<div id="grid"></div>

<!-- ============ HOTBAR ============ -->
<div class="hotbar" id="hotbar" aria-hidden="true">
  <div class="hotbar-inner">
    <div class="hotbar-brand" id="brand" title="Voltar ao topo">
      <div class="hotbar-dot"></div>
      <span>Projetos</span>
    </div>

    <div class="hotbar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="busca" type="text" placeholder="Buscar projeto…"
             autocomplete="off" spellcheck="false">
    </div>

    <div class="hotbar-count"><span id="count">0</span></div>
  </div>
</div>

<!-- ============ CONTEÚDO ============ -->
<main>
  <header id="header">
    <div class="header-badge">
      <span class="badge-dot"></span>
      <span class="badge-text">Portfólio</span>
    </div>
    <h1>Projetos</h1>
    <div class="header-meta">
      <span class="meta-line"></span>
      <span class="meta-text">Passe o mouse para ver</span>
      <span class="meta-line"></span>
    </div>
  </header>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      Carregando…
    </div>
  </div>
</main>

<script>
  // ============================================================
  // ⚙️ CONFIG
  // ============================================================
  const GITHUB_USER = 'capimmm';
  const GITHUB_REPO = 'utly';
  const BRANCH      = 'main';
  const IGNORAR     = ['index.html'];
  // ============================================================

  const API      = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${BRANCH}?recursive=1`;
  const BASE_URL = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/`;

  const temHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ============================================================
  // 🔲 GRADE REATIVA DE FUNDO
  // ============================================================
  const gridEl = document.getElementById('grid');
  const SIZE = 46;

  let cols, rows, blocks = [];

  function buildGrid() {
    gridEl.innerHTML = '';
    blocks = [];

    cols = Math.ceil(window.innerWidth  / SIZE);
    rows = Math.ceil(window.innerHeight / SIZE);

    gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    gridEl.style.gridTemplateRows    = `repeat(${rows}, 1fr)`;

    const frag = document.createDocumentFragment();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const div = document.createElement('div');
        div.className = 'block';
        frag.appendChild(div);
        blocks.push({ el: div, r, c });
      }
    }
    gridEl.appendChild(frag);
  }

  buildGrid();
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildGrid, 200);
  });

  const RADIUS = 3.2;
  const RIPPLE_DURATION = 750;
  const RIPPLE_MAX_RADIUS = 9;
  const RIPPLE_BAND = 1.4;

  let mouseX = -999, mouseY = -999;
  let ripples = [];
  let loopRunning = false;

  function cellCoords(px, py) {
    const cellW = window.innerWidth  / cols;
    const cellH = window.innerHeight / rows;
    return { col: px / cellW, row: py / cellH };
  }

  function render() {
    const { col: mCol, row: mRow } = cellCoords(mouseX, mouseY);
    const now = performance.now();

    ripples = ripples.filter(r => now - r.start < RIPPLE_DURATION);

    for (const b of blocks) {
      const hdx = (b.c + 0.5) - mCol;
      const hdy = (b.r + 0.5) - mRow;
      const hDist = Math.sqrt(hdx * hdx + hdy * hdy);
      const hoverAlpha = hDist < RADIUS ? Math.pow(1 - hDist / RADIUS, 2) : 0;

      let rippleAlpha = 0;
      for (const r of ripples) {
        const t = (now - r.start) / RIPPLE_DURATION;
        const ringRadius = t * RIPPLE_MAX_RADIUS;
        const fade = 1 - t;
        const rdx = (b.c + 0.5) - r.col;
        const rdy = (b.r + 0.5) - r.row;
        const dist = Math.sqrt(rdx * rdx + rdy * rdy);
        const band = Math.max(0, 1 - Math.abs(dist - ringRadius) / RIPPLE_BAND);
        rippleAlpha = Math.max(rippleAlpha, band * fade);
      }

      const alpha = Math.min(1, Math.max(hoverAlpha, rippleAlpha * 1.15));

      if (alpha > 0.01) {
        b.el.style.background =
          `color-mix(in srgb, var(--glow) ${(alpha * 55).toFixed(1)}%, var(--block))`;
        b.el.style.borderColor =
          `color-mix(in srgb, var(--glow) ${(alpha * 90).toFixed(1)}%, var(--block-border))`;
        b.el.style.boxShadow =
          `0 0 ${(alpha * 26).toFixed(1)}px color-mix(in srgb, var(--glow-soft) ${(alpha * 85).toFixed(1)}%, transparent)`;
      } else if (b.el.style.background !== '') {
        b.el.style.background  = '';
        b.el.style.borderColor = '';
        b.el.style.boxShadow   = '';
      }
    }

    if (ripples.length > 0) {
      requestAnimationFrame(render);
    } else {
      loopRunning = false;
    }
  }

  function kickLoop() {
    if (!loopRunning) {
      loopRunning = true;
      requestAnimationFrame(render);
    }
  }

  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    kickLoop();
  });

  window.addEventListener('mouseleave', () => {
    mouseX = -999;
    mouseY = -999;
    kickLoop();
  });

  window.addEventListener('click', (e) => {
    if (e.target.closest('.card-link')) return;
    if (e.target.closest('.hotbar'))   return;
    const { col, row } = cellCoords(e.clientX, e.clientY);
    ripples.push({ col, row, start: performance.now() });
    kickLoop();
  });

  // ============================================================
  // 🧭 HOTBAR
  // ============================================================
  const headerEl = document.getElementById('header');
  const hotbar   = document.getElementById('hotbar');
  const brand    = document.getElementById('brand');

  const observer = new IntersectionObserver(([entry]) => {
    const saiuPorCima = !entry.isIntersecting && entry.boundingClientRect.top < 0;
    hotbar.classList.toggle('visible', saiuPorCima);
    hotbar.setAttribute('aria-hidden', String(!saiuPorCima));
  }, { threshold: 0 });

  observer.observe(headerEl);

  brand.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ============================================================
  // 🌌 FUNDO DINÂMICO (2 iframes p/ crossfade)
  // ============================================================
  const bgLayer = document.getElementById('bgLayer');
  const bodyEl  = document.body;

  const frames = {
    a: document.getElementById('bgFrameA'),
    b: document.getElementById('bgFrameB')
  };

  let slotAtual = 'a';
  let urlAtual  = null;
  let reqId     = 0;
  let hideTimer = null;

  function mostrarFundo(url) {
    clearTimeout(hideTimer);
    if (!url) return;

    // mesma URL: só garante visibilidade
    if (url === urlAtual) {
      bgLayer.classList.add('active');
      bodyEl.classList.add('backgrounding');
      return;
    }

    urlAtual = url;
    const meuReq = ++reqId;

    const proximoSlot = slotAtual === 'a' ? 'b' : 'a';
    const proximo = frames[proximoSlot];
    const atual   = frames[slotAtual];

    proximo.classList.remove('visible');

    const onLoad = () => {
      proximo.removeEventListener('load', onLoad);
      if (meuReq !== reqId) return;

      // pequena espera pra garantir que o browser pintou o primeiro frame
      requestAnimationFrame(() => {
        if (meuReq !== reqId) return;
        proximo.classList.add('visible');
        atual.classList.remove('visible');
        slotAtual = proximoSlot;
        bgLayer.classList.add('active');
        bodyEl.classList.add('backgrounding');
      });
    };

    proximo.addEventListener('load', onLoad);

    // se já carregou essa URL nesse slot, reaproveita
    if (proximo.dataset.loaded !== url) {
      proximo.dataset.loaded = url;
      proximo.src = url;
    } else {
      onLoad();
    }

    // ativa a camada imediatamente (o frame aparece com o fade do CSS)
    bgLayer.classList.add('active');
    bodyEl.classList.add('backgrounding');
  }

  function esconderFundo() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      bgLayer.classList.remove('active');
      bodyEl.classList.remove('backgrounding');
    }, 180);
  }

  // ============================================================
  // 📁 CARREGA E RENDERIZA OS CARDS
  // ============================================================
  const content  = document.getElementById('content');
  const buscaEl  = document.getElementById('busca');
  const countEl  = document.getElementById('count');

  let vazioEl = null;

  async function carregarArquivos() {
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(`Erro ${res.status} — verifique se o repo é público e o branch é "${BRANCH}"`);
      const data = await res.json();

      const files = data.tree
        .filter(i => i.type === 'blob')
        .filter(i => i.path.toLowerCase().endsWith('.html'))
        .filter(i => !IGNORAR.includes(i.path))
        .map(i => ({
          name: i.path.split('/').pop().replace('.html', ''),
          path: i.path,
          url : BASE_URL + i.path
        }));

      renderizar(files);
    } catch (err) {
      content.innerHTML = `<div class="error">Erro: ${err.message}</div>`;
      console.error(err);
    }
  }

  function renderizar(files) {
    if (!files.length) {
      content.innerHTML = '<div class="empty">Nenhum projeto encontrado</div>';
      return;
    }

    content.innerHTML = `
      <div class="grid-cards">
        ${files.map((f, i) => criarCard(f, i)).join('')}
        <div class="empty" id="vazio" hidden>Nenhum projeto corresponde à busca</div>
      </div>
    `;

    vazioEl = document.getElementById('vazio');
    countEl.textContent = files.length;

    document.querySelectorAll('.card-link').forEach(el => {
      el.addEventListener('animationend', function handler() {
        el.style.animation = 'none';
        el.removeEventListener('animationend', handler);
      }, { once: true });
    });

    ativarCycling();
    ativarSelecao();
    aplicarFiltro(buscaEl.value);
  }

  function criarCard(f, index) {
    const nomeBonito = formatarNome(f.name);
    const frases = [
      f.path,
      'Passe o mouse para ver',
      f.url
    ];

    return `
      <a class="card-link"
         href="${f.url}"
         target="_blank"
         rel="noopener"
         data-index="${index}"
         data-name="${nomeBonito}"
         data-path="${f.path}"
         data-url="${f.url}"
         data-phrases='${JSON.stringify(frases)}'>
        <div class="card">
          <div class="main-row">
            <div class="icon">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z"
                      stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="info">
              <div class="info-title">${nomeBonito}</div>
              <div class="info-sub">
                <span>${frases[0]}</span>
              </div>
            </div>
            <div class="chevron">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M9 6l6 6-6 6"
                      stroke="white" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>
      </a>
    `;
  }

  // ============================================================
  // 🎯 SELEÇÃO DE CARD → muda o fundo
  // ============================================================
  function ativarSelecao() {
    document.querySelectorAll('.card-link').forEach(cardEl => {
      if (temHover) {
        cardEl.addEventListener('mouseenter', () => {
          document.querySelectorAll('.card-link.selected')
            .forEach(el => el.classList.remove('selected'));
          cardEl.classList.add('selected');
          mostrarFundo(cardEl.dataset.url);
        });

        cardEl.addEventListener('mouseleave', () => {
          cardEl.classList.remove('selected');
          esconderFundo();
        });
      }

      cardEl.addEventListener('focus', () => {
        document.querySelectorAll('.card-link.selected')
          .forEach(el => el.classList.remove('selected'));
        cardEl.classList.add('selected');
        mostrarFundo(cardEl.dataset.url);
      });

      cardEl.addEventListener('blur', () => {
        cardEl.classList.remove('selected');
        esconderFundo();
      });
    });
  }

  // ============================================================
  // 🔎 BUSCA / FILTRO
  // ============================================================
  function aplicarFiltro(termo) {
    const t = (termo || '').trim().toLowerCase();
    const cards = document.querySelectorAll('.card-link');
    let visiveis = 0;

    cards.forEach(el => {
      const ok = !t ||
        (el.dataset.name || '').toLowerCase().includes(t) ||
        (el.dataset.path || '').toLowerCase().includes(t);

      el.classList.toggle('oculto', !ok);
      if (ok) visiveis++;
    });

    countEl.textContent = visiveis;
    if (vazioEl) vazioEl.hidden = visiveis !== 0;

    const sel = document.querySelector('.card-link.selected');
    if (sel && sel.classList.contains('oculto')) {
      sel.classList.remove('selected');
      esconderFundo();
    }
  }

  buscaEl.addEventListener('input', () => aplicarFiltro(buscaEl.value));

  window.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== buscaEl) {
      e.preventDefault();
      buscaEl.focus();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      buscaEl.focus();
    }
    if (e.key === 'Escape' && document.activeElement === buscaEl) {
      buscaEl.value = '';
      aplicarFiltro('');
      buscaEl.blur();
    }
  });

  // ============================================================
  // 🔄 CICLO DE FRASES
  // ============================================================
  function ativarCycling() {
    document.querySelectorAll('.card-link').forEach(cardLink => {
      const frases = JSON.parse(cardLink.dataset.phrases);
      const cycleEl = cardLink.querySelector('.info-sub span');
      let cycleTimer = null;
      let idx = 0;

      function setPhrase(text) {
        const current = cycleEl;
        current.classList.add('leaving');
        setTimeout(() => {
          current.textContent = text;
          current.classList.remove('leaving');
          current.classList.add('entering');
          void current.offsetWidth;
          current.classList.remove('entering');
        }, 260);
      }

      cardLink.addEventListener('mouseenter', () => {
        idx = 0;
        clearInterval(cycleTimer);
        cycleTimer = setInterval(() => {
          idx = (idx + 1) % frases.length;
          setPhrase(frases[idx]);
        }, 1600);
      });

      cardLink.addEventListener('mouseleave', () => {
        clearInterval(cycleTimer);
        idx = 0;
        setPhrase(frases[0]);
      });
    });
  }

  function formatarNome(nome) {
    return nome
      .replace(/[-_]/g, ' ')
      .replace(/\b\w/g, l => l.toUpperCase());
  }

  carregarArquivos();
</script>

</body>
</html>
