<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projetos · capimmm</title>
<style>
  :root {
    --bg: #000;
    --block: #0a0a0a;
    --block-border: #1a1a1a;
    --glow: #ffffff;
    --glow-soft: #888888;
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.60);
    --ink-faint: rgba(255,255,255,0.34);
    --glass-bg: rgba(255,255,255,0.055);
    --glass-bg-hover: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.14);
    --ease: cubic-bezier(.19, 1, .22, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text',
                 'Inter', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  body {
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* ============================================
     GRADE REATIVA
     ============================================ */
  #grid {
    position: fixed;
    inset: 0;
    display: grid;
    z-index: 0;
    pointer-events: none;
  }

  .block {
    background: var(--block);
    border: 1px solid var(--block-border);
    transition: background 0.15s ease,
                box-shadow 0.15s ease,
                border-color 0.15s ease;
    will-change: background, box-shadow;
  }

  /* ============================================
     CONTEÚDO
     ============================================ */
  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    pointer-events: none;
  }

  header {
    text-align: center;
    margin-bottom: 56px;
    animation: fadeIn 1.2s var(--ease) both;
  }

  header h1 {
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 1.05;
    color: #fff;
  }

  header p {
    margin-top: 14px;
    font-size: 1rem;
    color: var(--ink-dim);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  /* ============================================
     GRID DE CARDS
     ============================================ */
  .grid-cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    width: 100%;
    max-width: 460px;
    pointer-events: auto;
  }

  /* ============================================
     CARD — GLASS APPLE
     ============================================ */
  .card-link {
    display: block;
    text-decoration: none;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
    animation: cardIn 1s var(--ease) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    filter: blur(0); }
  }

  .card-link:nth-child(1)    { animation-delay: 0.05s; }
  .card-link:nth-child(2)    { animation-delay: 0.12s; }
  .card-link:nth-child(3)    { animation-delay: 0.19s; }
  .card-link:nth-child(4)    { animation-delay: 0.26s; }
  .card-link:nth-child(5)    { animation-delay: 0.33s; }
  .card-link:nth-child(6)    { animation-delay: 0.40s; }
  .card-link:nth-child(7)    { animation-delay: 0.47s; }
  .card-link:nth-child(8)    { animation-delay: 0.54s; }
  .card-link:nth-child(9)    { animation-delay: 0.61s; }
  .card-link:nth-child(10)   { animation-delay: 0.68s; }
  .card-link:nth-child(n+11) { animation-delay: 0.75s; }

  .card {
    border-radius: 22px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(26px) saturate(140%);
    -webkit-backdrop-filter: blur(26px) saturate(140%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.18) inset,
      0 20px 45px -22px rgba(0,0,0,0.8);
    transition:
      transform .6s var(--ease),
      background .5s ease,
      box-shadow .6s var(--ease);
    will-change: transform;
    overflow: hidden;
  }

  .card-link:hover .card {
    transform: translateY(-3px);
    background: var(--glass-bg-hover);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.24) inset,
      0 30px 60px -20px rgba(0,0,0,0.85),
      0 0 40px -10px rgba(255,255,255,0.10);
  }

  .card-link:active .card {
    transform: translateY(-1px) scale(0.988);
  }

  .card-link:focus-visible .card {
    outline: 2px solid rgba(255,255,255,0.85);
    outline-offset: 3px;
  }

  .main-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px 18px 18px;
  }

  .icon {
    flex-shrink: 0;
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .6s var(--ease), background .5s ease;
  }

  .card-link:hover .icon {
    transform: scale(1.06);
    background: rgba(255,255,255,0.16);
  }

  .icon svg { width: 22px; height: 22px; }

  .info { flex: 1; min-width: 0; }

  .info-title {
    font-size: 15.5px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .info-sub {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    position: relative;
    height: 17px;
  }

  .info-sub span {
    position: absolute;
    left: 0;
    top: 0;
    white-space: nowrap;
    opacity: 1;
    transform: translateY(0);
    transition: opacity .38s var(--ease), transform .45s var(--ease);
  }

  .info-sub span.leaving {
    opacity: 0;
    transform: translateY(-6px);
  }

  .info-sub span.entering {
    opacity: 0;
    transform: translateY(6px);
  }

  .chevron {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .6s var(--ease), background .5s ease;
  }

  .chevron svg {
    width: 13px;
    height: 13px;
    transition: transform .6s var(--ease);
  }

  .card-link:hover .chevron { background: rgba(255,255,255,0.18); }
  .card-link:hover .chevron svg { transform: rotate(90deg); }

  /* expansão ao hover */
  .expand {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .6s var(--ease);
  }

  .card-link:hover .expand {
    grid-template-rows: 1fr;
  }

  .expand-inner { overflow: hidden; }

  .expand-content {
    padding: 0 20px 20px 84px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .45s ease .05s,
                transform .5s var(--ease) .05s;
  }

  .card-link:hover .expand-content {
    opacity: 1;
    transform: translateY(0);
  }

  .expand-content p {
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink-faint);
  }

  .expand-content .url {
    display: inline-block;
    margin-top: 10px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    border-top: 1px solid rgba(255,255,255,0.12);
    padding-top: 10px;
    word-break: break-all;
  }

  /* ============================================
     ESTADOS
     ============================================ */
  .loading, .error, .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-dim);
    font-size: 0.95rem;
    animation: fadeIn 0.6s ease both;
  }

  .spinner {
    width: 30px;
    height: 30px;
    border: 2px solid rgba(255,255,255,0.12);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 0 auto 18px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    main { padding: 60px 16px; }
    header { margin-bottom: 40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .block, .card, .icon, .chevron, .chevron svg,
    .expand, .expand-content, .card-link { transition: none; animation: none; }
  }
</style>
</head>
<body>

<div id="grid"></div>

<main>
  <header>
    <h1>Projetos</h1>
    <p>Selecione um para continuar</p>
  </header>

  <div id="content" style="width:100%; display:flex; justify-content:center;">
    <div class="loading">
      <div class="spinner"></div>
      Carregando…
    </div>
  </div>
</main>

<script>
  // ============================================================
  // ⚙️ CONFIG
  // ============================================================
  const GITHUB_USER = 'capimmm';
  const GITHUB_REPO = 'utly';
  const BRANCH      = 'main';           // troque p/ 'master' se necessário
  const IGNORAR     = ['index.html'];
  // ============================================================

  const API      = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${BRANCH}?recursive=1`;
  const BASE_URL = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/`;

  // ============================================================
  // 🔲 GRADE REATIVA
  // ============================================================
  const gridEl = document.getElementById('grid');
  const SIZE = 46;

  let cols, rows, blocks = [];

  function buildGrid() {
    gridEl.innerHTML = '';
    blocks = [];

    cols = Math.ceil(window.innerWidth  / SIZE);
    rows = Math.ceil(window.innerHeight / SIZE);

    gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    gridEl.style.gridTemplateRows    = `repeat(${rows}, 1fr)`;

    const frag = document.createDocumentFragment();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const div = document.createElement('div');
        div.className = 'block';
        frag.appendChild(div);
        blocks.push({ el: div, r, c });
      }
    }
    gridEl.appendChild(frag);
  }

  buildGrid();
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildGrid, 200);
  });

  const RADIUS = 3.2;
  const RIPPLE_DURATION = 750;
  const RIPPLE_MAX_RADIUS = 9;
  const RIPPLE_BAND = 1.4;

  let mouseX = -999, mouseY = -999;
  let ripples = [];
  let loopRunning = false;

  function cellCoords(px, py) {
    const cellW = window.innerWidth  / cols;
    const cellH = window.innerHeight / rows;
    return { col: px / cellW, row: py / cellH };
  }

  function render() {
    const { col: mCol, row: mRow } = cellCoords(mouseX, mouseY);
    const now = performance.now();

    ripples = ripples.filter(r => now - r.start < RIPPLE_DURATION);

    for (const b of blocks) {
      const hdx = (b.c + 0.5) - mCol;
      const hdy = (b.r + 0.5) - mRow;
      const hDist = Math.sqrt(hdx * hdx + hdy * hdy);
      const hoverAlpha = hDist < RADIUS ? Math.pow(1 - hDist / RADIUS, 2) : 0;

      let rippleAlpha = 0;
      for (const r of ripples) {
        const t = (now - r.start) / RIPPLE_DURATION;
        const ringRadius = t * RIPPLE_MAX_RADIUS;
        const fade = 1 - t;
        const rdx = (b.c + 0.5) - r.col;
        const rdy = (b.r + 0.5) - r.row;
        const dist = Math.sqrt(rdx * rdx + rdy * rdy);
        const band = Math.max(0, 1 - Math.abs(dist - ringRadius) / RIPPLE_BAND);
        rippleAlpha = Math.max(rippleAlpha, band * fade);
      }

      const alpha = Math.min(1, Math.max(hoverAlpha, rippleAlpha * 1.15));

      if (alpha > 0.01) {
        b.el.style.background =
          `color-mix(in srgb, var(--glow) ${(alpha * 55).toFixed(1)}%, var(--block))`;
        b.el.style.borderColor =
          `color-mix(in srgb, var(--glow) ${(alpha * 90).toFixed(1)}%, var(--block-border))`;
        b.el.style.boxShadow =
          `0 0 ${(alpha * 26).toFixed(1)}px color-mix(in srgb, var(--glow-soft) ${(alpha * 85).toFixed(1)}%, transparent)`;
      } else if (b.el.style.background !== '') {
        b.el.style.background  = '';
        b.el.style.borderColor = '';
        b.el.style.boxShadow   = '';
      }
    }

    if (ripples.length > 0) {
      requestAnimationFrame(render);
    } else {
      loopRunning = false;
    }
  }

  function kickLoop() {
    if (!loopRunning) {
      loopRunning = true;
      requestAnimationFrame(render);
    }
  }

  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    kickLoop();
  });

  window.addEventListener('mouseleave', () => {
    mouseX = -999;
    mouseY = -999;
    kickLoop();
  });

  window.addEventListener('click', (e) => {
    if (e.target.closest('.card-link')) return;
    const { col, row } = cellCoords(e.clientX, e.clientY);
    ripples.push({ col, row, start: performance.now() });
    kickLoop();
  });

  // ============================================================
  // 📁 CARREGA E RENDERIZA OS CARDS
  // ============================================================
  const content = document.getElementById('content');

  async function carregarArquivos() {
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(`Erro ${res.status} — verifique se o repo é público e o branch é "${BRANCH}"`);
      const data = await res.json();

      const files = data.tree
        .filter(i => i.type === 'blob')
        .filter(i => i.path.toLowerCase().endsWith('.html'))
        .filter(i => !IGNORAR.includes(i.path))
        .map(i => ({
          name: i.path.split('/').pop().replace('.html', ''),
          path: i.path,
          url : BASE_URL + i.path
        }));

      renderizar(files);
    } catch (err) {
      content.innerHTML = `<div class="error">Erro: ${err.message}</div>`;
      console.error(err);
    }
  }

  function renderizar(files) {
    if (!files.length) {
      content.innerHTML = '<div class="empty">Nenhum projeto encontrado</div>';
      return;
    }

    content.innerHTML = `
      <div class="grid-cards">
        ${files.map((f, i) => criarCard(f, i)).join('')}
      </div>
    `;

    ativarCycling(files);
  }

  function criarCard(f, index) {
    const nomeBonito = formatarNome(f.name);
    const frases = [
      f.path,
      'Clique para abrir',
      f.url
    ];

    return `
      <a class="card-link"
         href="${f.url}"
         data-index="${index}"
         data-phrases='${JSON.stringify(frases)}'>
        <div class="card">
          <div class="main-row">
            <div class="icon">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z"
                      stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="info">
              <div class="info-title">${nomeBonito}</div>
              <div class="info-sub">
                <span>${frases[0]}</span>
              </div>
            </div>
            <div class="chevron">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M9 6l6 6-6 6"
                      stroke="white" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="expand">
            <div class="expand-inner">
              <div class="expand-content">
                <p>Página HTML do repositório ${GITHUB_USER}/${GITHUB_REPO}.</p>
                <span class="url">${f.url}</span>
              </div>
            </div>
          </div>
        </div>
      </a>
    `;
  }

  // ============================================================
  // 🔄 CICLO DE FRASES (por card, só quando hover)
  // ============================================================
  function ativarCycling() {
    document.querySelectorAll('.card-link').forEach(cardLink => {
      const frases = JSON.parse(cardLink.dataset.phrases);
      const cycleEl = cardLink.querySelector('.info-sub span');
      let cycleTimer = null;
      let idx = 0;

      function setPhrase(text) {
        const current = cycleEl;
        current.classList.add('leaving');
        setTimeout(() => {
          current.textContent = text;
          current.classList.remove('leaving');
          current.classList.add('entering');
          void current.offsetWidth;
          current.classList.remove('entering');
        }, 260);
      }

      cardLink.addEventListener('mouseenter', () => {
        idx = 0;
        clearInterval(cycleTimer);
        cycleTimer = setInterval(() => {
          idx = (idx + 1) % frases.length;
          setPhrase(frases[idx]);
        }, 1600);
      });

      cardLink.addEventListener('mouseleave', () => {
        clearInterval(cycleTimer);
        idx = 0;
        setPhrase(frases[0]);
      });
    });
  }

  function formatarNome(nome) {
    return nome
      .replace(/[-_]/g, ' ')
      .replace(/\b\w/g, l => l.toUpperCase());
  }

  carregarArquivos();
</script>

</body>
</html>
