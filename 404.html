<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <script>
    (function() {
      // Pega o caminho tentado (ex: /sobre)
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // Se não terminar com .html nem for a raiz, adiciona .html e redireciona
      if (!path.endsWith('.html') && !path.endsWith('/')) {
        var realUrl = path + '.html' + search + hash;
        sessionStorage.setItem('clean_url', path + search + hash);
        window.location.replace(realUrl);
      }
    })();
  </script>
</head>
<body>
</body>
</html>
