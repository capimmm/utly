<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notas</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  /* cor das linhas animável */
  @property --line-color {
    syntax: '<color>';
    inherits: true;
    initial-value: rgba(34, 197, 94, 0.22);
  }

  :root {
    --green: #22c55e;
    --green-glow: rgba(34, 197, 94, 0.45);
    --white: #f5f5f5;
    --bg: #0a0a0a;
    --card: rgba(18, 18, 18, 0.55);
    --border: rgba(255, 255, 255, 0.07);
    --text: #e5e7eb;
    --muted: #6b7280;
    --lh: 30px;
    --line-color: rgba(34, 197, 94, 0.22);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  html, body { min-height: 100%; }

  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 56px 20px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== FUNDO ========== */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 50%, #000 20%, transparent 85%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 20%, transparent 85%);
    animation: gridDrift 60s linear infinite;
  }
  @keyframes gridDrift {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 44px 44px, 44px 44px; }
  }

  .bg-grid-bright {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image:
      linear-gradient(rgba(34, 197, 94, 0.38) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34, 197, 94, 0.38) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(
      200px circle at var(--mx, -999px) var(--my, -999px),
      #000 0%, rgba(0,0,0,0.4) 45%, transparent 72%
    );
    -webkit-mask-image: radial-gradient(
      200px circle at var(--mx, -999px) var(--my, -999px),
      #000 0%, rgba(0,0,0,0.4) 45%, transparent 72%
    );
  }

  .bg-glow {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(
      500px circle at var(--mx, -999px) var(--my, -999px),
      rgba(34, 197, 94, 0.11),
      transparent 60%
    );
  }

  .bg-vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.7) 100%);
  }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  /* ========== CABEÇALHO ========== */
  header {
    text-align: center;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.9s var(--ease-out) 0.05s forwards;
  }

  header h1 {
    font-size: clamp(1.8rem, 4vw, 2.3rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--white);
    margin-bottom: 10px;
    display: inline-block;
  }

  header h1 span { color: var(--green); }

  header p {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.9s var(--ease-out) 0.2s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ========== EDITOR ========== */
  .editor {
    position: relative;
    background: var(--card);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 40px;
    box-shadow:
      0 12px 44px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    transition:
      border-color 0.5s var(--ease-soft),
      box-shadow 0.6s var(--ease-soft),
      transform 0.5s var(--ease-soft);
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.9s var(--ease-out) 0.35s forwards;
  }

  .editor::before {
    content: "";
    position: absolute;
    top: 0; left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      100deg,
      transparent 0%,
      rgba(34, 197, 94, 0.07) 50%,
      transparent 100%
    );
    transform: skewX(-20deg);
    animation: editorShine 8s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes editorShine {
    0%, 70% { left: -120%; }
    100%    { left: 220%; }
  }

  .editor:focus-within {
    border-color: rgba(34, 197, 94, 0.3);
    transform: translateY(-2px);
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(34, 197, 94, 0.14),
      0 0 50px rgba(34, 197, 94, 0.1);
  }

  .editor > * { position: relative; z-index: 1; }

  /* --- TÍTULO --- */
  .editor-title {
    width: 100%;
    color: var(--white);
    font-size: 1.15rem;
    font-weight: 600;
    font-family: inherit;
    padding: 18px 24px;
    outline: none;
    letter-spacing: -0.01em;
    caret-color: var(--green);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    transition:
      border-color 0.45s var(--ease-soft),
      padding-left 0.4s var(--ease-soft);
  }

  .editor-title:focus {
    border-bottom-color: rgba(34, 197, 94, 0.35);
    padding-left: 28px;
  }

  /* --- CORPO --- */
  .editor-body { padding: 12px 14px; }

  .editor-text {
    width: 100%;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    line-height: var(--lh);
    padding: 0 10px;
    min-height: calc(var(--lh) * 3);
    outline: none;
    caret-color: var(--green);
    white-space: pre-wrap;
    word-wrap: break-word;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--lh) - 1px),
      var(--line-color) calc(var(--lh) - 1px),
      var(--line-color) var(--lh)
    );
    background-origin: content-box;
    background-clip: content-box;
    transition: --line-color 0.6s var(--ease-soft);
  }

  .editor-text div,
  .editor-text p {
    margin: 0;
    line-height: var(--lh);
  }

  /* ========== ANIMAÇÃO DE ESCRITA (letra por letra) ========== */
  .char-appear {
    display: inline;
    animation: charIn 0.42s var(--ease-out) forwards;
  }

  @keyframes charIn {
    0% {
      opacity: 0;
      text-shadow:
        0 0 6px var(--green),
        0 0 14px var(--green-glow);
      filter: brightness(2);
    }
    45% {
      opacity: 1;
      text-shadow:
        0 0 4px var(--green),
        0 0 10px var(--green-glow);
      filter: brightness(1.5);
    }
    100% {
      opacity: 1;
      text-shadow: none;
      filter: brightness(1);
    }
  }

  /* ========== RODAPÉ DO EDITOR ========== */
  .editor-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px;
    border-top: 1px solid var(--border);
    gap: 16px;
    flex-wrap: wrap;
  }

  .color-picker {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .color-picker > span {
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    margin-right: 4px;
  }

  .color-dot {
    position: relative;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition:
      transform 0.45s var(--ease-bounce),
      border-color 0.3s var(--ease-soft),
      box-shadow 0.4s var(--ease-soft);
    overflow: visible;
  }

  .color-dot::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: #0a0a0a;
    opacity: 0;
    transform: scale(0.4);
    transition:
      opacity 0.35s var(--ease-soft),
      transform 0.45s var(--ease-bounce);
    z-index: 2;
  }

  .color-dot:hover { transform: scale(1.2); }

  .color-dot.selected {
    border-color: var(--white);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.06);
    transform: scale(1.1);
  }
  .color-dot.selected::after { opacity: 1; transform: scale(1); }

  /* ripple ao clicar */
  .ripple {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.35;
    pointer-events: none;
    animation: rippleOut 0.7s var(--ease-out) forwards;
  }
  @keyframes rippleOut {
    0%   { transform: scale(1); opacity: 0.55; }
    100% { transform: scale(2.8); opacity: 0; }
  }

  /* ========== BOTÃO ========== */
  .btn-add {
    position: relative;
    background: var(--green);
    color: #04140a;
    border: none;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    overflow: hidden;
    transition:
      transform 0.35s var(--ease-bounce),
      box-shadow 0.4s var(--ease-soft),
      filter 0.3s var(--ease-soft);
  }

  .btn-add::before {
    content: "";
    position: absolute;
    top: 0; left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent);
    transform: skewX(-20deg);
    transition: left 0.7s var(--ease-out);
  }
  .btn-add:hover::before { left: 130%; }

  .btn-add:hover {
    transform: translateY(-2px) scale(1.02);
    filter: brightness(1.15);
    box-shadow: 0 10px 28px var(--green-glow);
  }
  .btn-add:active { transform: translateY(0) scale(0.98); }

  /* ========== NOTAS ========== */
  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }

  .note {
    position: relative;
    padding: 20px 18px 18px 24px;
    background: var(--card);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow:
      0 6px 24px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    display: flex;
    flex-direction: column;
    min-height: 150px;
    word-wrap: break-word;
    overflow-wrap: break-word;
    transition:
      transform 0.5s var(--ease-out),
      box-shadow 0.5s var(--ease-soft),
      border-color 0.5s var(--ease-soft),
      opacity 0.4s var(--ease-soft);
  }

  .note.entering { animation: noteIn 0.75s var(--ease-out) forwards; }

  @keyframes noteIn {
    0%   { opacity: 0; transform: translateY(22px) scale(0.94); filter: blur(8px); }
    60%  { filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  .note.leaving {
    animation: noteOut 0.4s var(--ease-soft) forwards;
    pointer-events: none;
  }

  @keyframes noteOut {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-10px) scale(0.9); filter: blur(4px); }
  }

  .note::before {
    content: "";
    position: absolute;
    left: 0;
    top: 18px;
    bottom: 18px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--nota-cor, var(--green));
    box-shadow: 0 0 14px var(--nota-cor, var(--green));
    opacity: 0.9;
    transform-origin: top;
    transition: transform 0.5s var(--ease-out), box-shadow 0.5s var(--ease-soft);
  }

  .note:hover {
    transform: translateY(-5px);
    border-color: rgba(255, 255, 255, 0.13);
    box-shadow:
      0 20px 44px rgba(0, 0, 0, 0.5),
      0 0 26px var(--nota-cor, var(--green)),
      inset 0 1px 0 rgba(255, 255, 255, 0.07);
  }

  .note:hover::before {
    transform: scaleY(1.15);
    box-shadow: 0 0 22px var(--nota-cor, var(--green));
  }

  .note h3 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 8px;
    padding-right: 26px;
    color: var(--white);
    letter-spacing: -0.01em;
  }

  .note p {
    color: rgba(229, 231, 235, 0.72);
    font-size: 0.87rem;
    line-height: 1.6;
    flex: 1;
    white-space: pre-wrap;
  }

  .note .date {
    font-size: 0.66rem;
    color: var(--muted);
    margin-top: 16px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .delete-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: none;
    color: var(--muted);
    width: 24px;
    height: 24px;
    border-radius: 6px;
    font-size: 0.7rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.7) rotate(-45deg);
    transition:
      opacity 0.4s var(--ease-soft),
      transform 0.5s var(--ease-bounce),
      background 0.3s var(--ease-soft),
      color 0.3s var(--ease-soft);
    font-family: inherit;
  }

  .note:hover .delete-btn {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  .delete-btn:hover {
    background: rgba(239, 68, 68, 0.15);
    color: #ef4444;
    transform: scale(1.15) rotate(90deg) !important;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.8s var(--ease-out) 0.3s forwards;
  }

  @media (max-width: 500px) {
    body { padding: 28px 14px; }
    .editor-footer { flex-direction: column; align-items: stretch; }
    .btn-add { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-grid-bright"></div>
  <div class="bg-glow"></div>
  <div class="bg-vignette"></div>

  <div class="container">
    <header>
      <h1>Notas<span>.</span></h1>
      <p>escreva · organize · guarde</p>
    </header>

    <div class="editor">
      <div class="editor-title"
           id="titulo"
           contenteditable="true"
           spellcheck="false"></div>
      <div class="editor-body">
        <div class="editor-text"
             id="conteudo"
             contenteditable="true"
             spellcheck="false"></div>
      </div>
      <div class="editor-footer">
        <div class="color-picker">
          <span>cor</span>
          <div class="color-dot selected" data-cor="#22c55e" style="background:#22c55e; color:#22c55e;"></div>
          <div class="color-dot" data-cor="#6b7280" style="background:#6b7280; color:#6b7280;"></div>
          <div class="color-dot" data-cor="#e5e7eb" style="background:#e5e7eb; color:#e5e7eb;"></div>
        </div>
        <button class="btn-add" id="addBtn">Adicionar</button>
      </div>
    </div>

    <div class="notes-grid" id="notesGrid"></div>
  </div>

<script>
  const STORAGE_KEY   = 'notas_v5';
  const tituloEl      = document.getElementById('titulo');
  const conteudoEl    = document.getElementById('conteudo');
  const addBtn        = document.getElementById('addBtn');
  const notesGrid     = document.getElementById('notesGrid');
  const colorDots     = document.querySelectorAll('.color-dot');

  let corSelecionada = '#22c55e';
  let notas = [];

  /* ============ FUNDO INTERATIVO (lerp) ============ */
  let mx = innerWidth / 2, my = innerHeight / 2, tx = mx, ty = my;

  addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });

  (function loop() {
    mx += (tx - mx) * 0.08;
    my += (ty - my) * 0.08;
    document.documentElement.style.setProperty('--mx', mx + 'px');
    document.documentElement.style.setProperty('--my', my + 'px');
    requestAnimationFrame(loop);
  })();

  /* ============ ANIMAÇÃO DE ESCRITA ============ */
  function animateLastChar(el) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if (range.startOffset === 0) return;
    if (!range.startContainer.nodeType === Node.TEXT_NODE) return;

    try {
      const wrapRange = document.createRange();
      wrapRange.setStart(range.startContainer, range.startOffset - 1);
      wrapRange.setEnd(range.startContainer, range.startOffset);

      // se o char já está dentro de um span .char-appear, ignora
      const parent = wrapRange.startContainer.parentNode;
      if (parent && parent.classList && parent.classList.contains('char-appear')) return;

      const span = document.createElement('span');
      span.className = 'char-appear';
      wrapRange.surroundContents(span);

      // reposiciona o cursor após o span
      const newRange = document.createRange();
      newRange.setStartAfter(span);
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);

      // remove o span após a animação (para não quebrar o layout)
      span.addEventListener('animationend', () => {
        const p = span.parentNode;
        if (!p) return;
        while (span.firstChild) p.insertBefore(span.firstChild, span);
        p.removeChild(span);
        p.normalize();
      }, { once: true });
    } catch (e) { /* ignore */ }
  }

  /* ============ HELPERS ============ */
  function getText(el) {
    return (el.textContent || '').replace(/\u00A0/g, ' ');
  }

  function insertTextAtCursor(text) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const node = document.createTextNode(text);
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function triggerInput(el) {
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }

  /* ============ ENTER: título single-line, corpo quebra linha ============ */
  tituloEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      addBtn.click();
    }
  });

  conteudoEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
      e.preventDefault();
      insertTextAtCursor('\n');
      animateLastChar(conteudoEl);
      triggerInput(conteudoEl);
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      addBtn.click();
    }
  });

  /* ============ INPUT: anima cada letra digitada ============ */
  [tituloEl, conteudoEl].forEach(el => {
    el.addEventListener('input', e => {
      // só anima em inserção de um único caractere (digitação normal)
      if (e.inputType === 'insertText' && e.data && e.data.length === 1) {
        animateLastChar(el);
      }
    });
  });

  /* ============ CORES (com ripple + transição suave) ============ */
  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  colorDots.forEach(dot => {
    dot.addEventListener('click', () => {
      // ripple
      const rip = document.createElement('span');
      rip.className = 'ripple';
      dot.appendChild(rip);
      setTimeout(() => rip.remove(), 700);

      colorDots.forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
      corSelecionada = dot.dataset.cor;

      // anima a cor das linhas (via @property)
      document.documentElement.style.setProperty(
        '--line-color',
        hexToRgba(corSelecionada, 0.22)
      );

      // pequeno pop no editor para reforçar a troca
      const ed = document.querySelector('.editor');
      ed.animate(
        [
          { transform: 'translateY(-2px) scale(1)' },
          { transform: 'translateY(-2px) scale(0.995)' },
          { transform: 'translateY(-2px) scale(1)' }
        ],
        { duration: 300, easing: 'cubic-bezier(0.34,1.56,0.64,1)' }
      );
    });
  });

  /* ============ DADOS ============ */
  function carregar() {
    try {
      const d = localStorage.getItem(STORAGE_KEY);
      notas = d ? JSON.parse(d) : [];
    } catch (e) { notas = []; }
  }
  function salvar() { localStorage.setItem(STORAGE_KEY, JSON.stringify(notas)); }

  function formatarData(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  /* ============ RENDER ============ */
  function render(animarIds = []) {
    notesGrid.innerHTML = '';

    if (notas.length === 0) {
      notesGrid.innerHTML = '<div class="empty">nenhuma nota ainda</div>';
      return;
    }

    [...notas].sort((a,b) => b.criado - a.criado).forEach((nota, i) => {
      const el = document.createElement('div');
      el.className = 'note';
      el.dataset.id = nota.id;
      el.style.setProperty('--nota-cor', nota.cor || '#22c55e');

      if (animarIds.includes(nota.id)) {
        el.classList.add('entering');
        el.style.animationDelay = (i * 50) + 'ms';
      } else {
        el.style.opacity = '0';
        el.style.animation = `noteIn 0.75s var(--ease-out) ${i * 60}ms forwards`;
      }

      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.innerHTML = '✕';
      del.setAttribute('aria-label', 'excluir');
      del.onclick = (e) => { e.stopPropagation(); excluir(nota.id, el); };

      const h3 = document.createElement('h3');
      h3.textContent = nota.titulo || 'sem título';

      const p = document.createElement('p');
      p.textContent = nota.conteudo;

      const date = document.createElement('div');
      date.className = 'date';
      date.textContent = formatarData(nota.criado);

      el.append(del, h3, p, date);
      notesGrid.appendChild(el);
    });
  }

  /* ============ AÇÕES ============ */
  function adicionar() {
    const titulo   = getText(tituloEl).trim();
    const conteudo = getText(conteudoEl).replace(/\n+$/,'').trim();

    if (!titulo && !conteudo) {
      tituloEl.focus();
      document.querySelector('.editor').animate(
        [
          { transform: 'translateX(0)' },
          { transform: 'translateX(-5px)' },
          { transform: 'translateX(5px)' },
          { transform: 'translateX(0)' }
        ],
        { duration: 320, easing: 'ease-in-out' }
      );
      return;
    }

    const nova = {
      id: Date.now() + Math.random(),
      titulo, conteudo,
      cor: corSelecionada,
      criado: Date.now()
    };

    notas.push(nova);
    salvar();
    render([nova.id]);

    // limpa
    tituloEl.textContent = '';
    conteudoEl.textContent = '';
    tituloEl.focus();

    // confirmação no botão
    addBtn.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(0.94)' }, { transform: 'scale(1)' }],
      { duration: 350, easing: 'cubic-bezier(0.34,1.56,0.64,1)' }
    );
  }

  function excluir(id, el) {
    if (el) el.classList.add('leaving');
    setTimeout(() => {
      notas = notas.filter(n => n.id !== id);
      salvar();
      render();
    }, 380);
  }

  addBtn.addEventListener('click', adicionar);

  /* ============ INIT ============ */
  carregar();
  render();
</script>
</body>
</html>
